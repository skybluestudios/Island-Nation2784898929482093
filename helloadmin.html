<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selim Island - Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBG5L210aazB1GwIGJylYP9qB1PkC90g8PULavdk2W0p9Os-4moolYamcKBKVYQ9QF/exec";
  </script>

  <header class="border-b border-slate-800 bg-slate-900 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-amber-400">🛡️ Admin Console - Selim Island Nation</h1>
    <button id="btnLogout" onclick="window.location.reload()" class="hidden text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded">Sign Out</button>
  </header>

  <main class="max-w-7xl mx-auto p-6">

    <!-- Admin Authentication View -->
    <div id="adminLoginView" class="max-w-md mx-auto my-20 bg-slate-900 border border-slate-800 p-8 rounded-xl shadow-2xl">
      <h2 class="text-xl font-bold text-center text-amber-400 mb-6">Admin Authentication</h2>
      <form onsubmit="authenticateAdmin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Admin Password</label>
          <input type="password" id="adminPasswordInput" required class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-white">
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded">Login</button>
      </form>
      <div id="loginError" class="mt-4 text-center text-rose-400 text-sm"></div>
    </div>

    <!-- Admin Console Dashboard -->
    <div id="adminConsoleView" class="hidden space-y-6">
      
      <!-- Category Tabs -->
      <div class="flex flex-wrap border-b border-slate-800 gap-2 pb-2 text-xs font-semibold">
        <button onclick="switchTab('pending_users')" id="tab_pending_users" class="px-3 py-2 rounded bg-amber-500 text-slate-950">Pending Account Approvals</button>
        <button onclick="switchTab('registered_users')" id="tab_registered_users" class="px-3 py-2 rounded bg-slate-800 text-slate-300">Approved User Accounts</button>
        <button onclick="switchTab('current_citizen')" id="tab_current_citizen" class="px-3 py-2 rounded bg-slate-800 text-slate-300">Current Citizens</button>
        <button onclick="switchTab('current_pass')" id="tab_current_pass" class="px-3 py-2 rounded bg-slate-800 text-slate-300">Current Pass Holders</button>
        <button onclick="switchTab('pending_citizen')" id="tab_pending_citizen" class="px-3 py-2 rounded bg-slate-800 text-slate-300">Pending Citizens</button>
        <button onclick="switchTab('pending_pass')" id="tab_pending_pass" class="px-3 py-2 rounded bg-slate-800 text-slate-300">Pending Pass Holders</button>
        <button onclick="switchTab('expired_pass')" id="tab_expired_pass" class="px-3 py-2 rounded bg-slate-800 text-slate-300">Expired Pass Holders</button>
        <button onclick="switchTab('paused_citizen')" id="tab_paused_citizen" class="px-3 py-2 rounded bg-slate-800 text-slate-300">Citizenship Paused / Removed</button>
      </div>

      <!-- Data Table -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-x-auto shadow-xl">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-950 text-slate-400 border-b border-slate-800 text-xs uppercase">
            <tr id="tableHeaders"></tr>
          </thead>
          <tbody id="adminTableBody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    let adminPwd = "";
    let rawData = { users: [], citizens: [], passes: [] };
    let currentTab = "pending_users";

    async function authenticateAdmin(e) {
      e.preventDefault();
      adminPwd = document.getElementById('adminPasswordInput').value;
      
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: "adminVerifyPassword", adminPassword: adminPwd })
      });
      const result = await res.json();

      if (result.success) {
        document.getElementById('adminLoginView').classList.add('hidden');
        document.getElementById('adminConsoleView').classList.remove('hidden');
        document.getElementById('btnLogout').classList.remove('hidden');
        loadAllData();
      } else {
        document.getElementById('loginError').innerText = result.message;
      }
    }

    async function loadAllData() {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: "adminGetAllData", adminPassword: adminPwd })
      });
      const result = await res.json();
      if (result.success) {
        rawData = result.data;
        renderCurrentTab();
      }
    }

    function switchTab(tabKey) {
      currentTab = tabKey;
      ['pending_users','registered_users','current_citizen','current_pass','pending_citizen','pending_pass','expired_pass','paused_citizen'].forEach(k => {
        document.getElementById('tab_' + k).className = k === tabKey ? "px-3 py-2 rounded bg-amber-500 text-slate-950 font-bold" : "px-3 py-2 rounded bg-slate-800 text-slate-300 font-semibold";
      });
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const headers = document.getElementById('tableHeaders');
      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = "";

      if (currentTab === "pending_users" || currentTab === "registered_users") {
        headers.innerHTML = `<th class="p-4">User ID</th><th class="p-4">Full Name</th><th class="p-4">Email</th><th class="p-4">Account Status</th><th class="p-4">Request Mode</th><th class="p-4">Actions</th>`;
        
        let filtered = rawData.users.filter(u => currentTab === "pending_users" ? u.accountStatus === "Pending" : u.accountStatus === "Approved");

        filtered.forEach(u => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="p-4 font-mono font-bold text-amber-300">${u.userId}</td>
            <td class="p-4 font-medium text-white">${u.fullName}</td>
            <td class="p-4 text-xs">${u.email}</td>
            <td class="p-4 font-bold ${u.accountStatus === 'Approved' ? 'text-emerald-400' : 'text-amber-400'}">${u.accountStatus}</td>
            <td class="p-4 text-xs font-semibold ${u.requestsLocked === 'Yes' ? 'text-rose-400' : 'text-slate-300'}">${u.requestsLocked === 'Yes' ? '🔒 Locked' : '🔓 Allowed'}</td>
            <td class="p-4 space-x-1">
              ${u.accountStatus !== 'Approved' ? `<button onclick="updateUserAccount(this, '${u.userId}', 'Approved', undefined)" class="bg-emerald-600 text-xs px-2 py-1 rounded">Approve Account</button>` : ''}
              ${u.requestsLocked !== 'Yes' ? `<button onclick="updateUserAccount(this, '${u.userId}', undefined, 'Yes')" class="bg-rose-600 text-xs px-2 py-1 rounded">Lock Requests</button>` : `<button onclick="updateUserAccount(this, '${u.userId}', undefined, 'No')" class="bg-slate-700 text-xs px-2 py-1 rounded">Unlock Requests</button>`}
            </td>
          `;
          tbody.appendChild(tr);
        });
      } else if (currentTab.includes("citizen")) {
        headers.innerHTML = `<th class="p-4">Passport No</th><th class="p-4">Applicant</th><th class="p-4">Email</th><th class="p-4">Status</th><th class="p-4">Approval Date</th><th class="p-4">Actions</th>`;
        
        let filtered = rawData.citizens.filter(c => {
          if (currentTab === "current_citizen") return c.status === "Approved";
          if (currentTab === "pending_citizen") return c.status === "Pending";
          if (currentTab === "paused_citizen") return c.status === "Paused" || c.status === "Revoked";
        });

        filtered.forEach(c => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="p-4 font-mono font-bold text-amber-300">${c.passportNumber}</td>
            <td class="p-4">${c.fullName}</td>
            <td class="p-4 text-xs">${c.email}</td>
            <td class="p-4 font-bold ${c.status === 'Approved' ? 'text-emerald-400' : c.status === 'Paused' ? 'text-amber-400' : 'text-rose-400'}">${c.status}</td>
            <td class="p-4 text-xs">${c.issuedDate}</td>
            <td class="p-4 space-x-1">
              ${c.status !== 'Approved' ? `<button onclick="updateCit(this, '${c.passportNumber}','Approved')" class="bg-emerald-600 text-xs px-2 py-1 rounded">Approve</button>` : ''}
              ${c.status !== 'Paused' ? `<button onclick="updateCit(this, '${c.passportNumber}','Paused')" class="bg-amber-600 text-xs px-2 py-1 rounded">Pause</button>` : ''}
              ${c.status !== 'Revoked' ? `<button onclick="updateCit(this, '${c.passportNumber}','Revoked')" class="bg-rose-600 text-xs px-2 py-1 rounded">Revoke</button>` : ''}
            </td>
          `;
          tbody.appendChild(tr);
        });
      } else {
        headers.innerHTML = `<th class="p-4">Pass ID</th><th class="p-4">Applicant</th><th class="p-4">Type</th><th class="p-4">Status</th><th class="p-4">Approval Date & Time</th><th class="p-4">Expiration Time</th><th class="p-4">Actions</th>`;
        
        let filtered = rawData.passes.filter(p => {
          if (currentTab === "current_pass") return p.status === "Approved";
          if (currentTab === "pending_pass") return p.status === "Pending";
          if (currentTab === "expired_pass") return p.status === "Expired" || p.status === "Revoked";
        });

        filtered.forEach(p => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="p-4 font-mono font-bold text-amber-300">${p.passId}</td>
            <td class="p-4">${p.fullName}</td>
            <td class="p-4 text-xs font-semibold">${p.passType}</td>
            <td class="p-4 font-bold">${p.status}</td>
            <td class="p-4 text-xs">${p.approvedAt}</td>
            <td class="p-4 text-xs text-amber-400 font-bold">${p.expiresAt}</td>
            <td class="p-4 space-x-1">
              ${p.status !== 'Approved' ? `<button onclick="updatePass(this, '${p.passId}','Approved')" class="bg-emerald-600 text-xs px-2 py-1 rounded">Approve</button>` : ''}
              ${p.status !== 'Revoked' ? `<button onclick="updatePass(this, '${p.passId}','Revoked')" class="bg-rose-600 text-xs px-2 py-1 rounded">Revoke</button>` : ''}
            </td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    async function updateUserAccount(btn, userId, newAccountStatus, requestsLocked) {
      btn.disabled = true;
      btn.innerText = "Updating...";
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: "adminUpdateUserAccount", adminPassword: adminPwd, userId, newAccountStatus, requestsLocked })
      });
      await loadAllData();
    }

    async function updateCit(btn, passportNumber, newStatus) {
      btn.disabled = true;
      btn.innerText = "Updating...";
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: "adminUpdateCitizenStatus", adminPassword: adminPwd, passportNumber, newStatus })
      });
      await loadAllData();
    }

    async function updatePass(btn, passId, newStatus) {
      btn.disabled = true;
      btn.innerText = "Updating...";
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: "adminUpdatePassStatus", adminPassword: adminPwd, passId, newStatus })
      });
      await loadAllData();
    }
  </script>
</body>
</html>
